name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Cœur logique (PowerShell 7, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyse statique (compatibilité Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200 | Write-Host
          if ($results | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer a trouvé des erreurs.' }
      - name: Tests Pester
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

  windows:
    name: Windows (PowerShell 5.1 et 7, interface WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5' })) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          }
      - name: Tests Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $PSVersionTable.PSVersion
          Invoke-Pester -Path tests -CI
      - name: Tests Pester (PowerShell 7)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5' })) {
            Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.5
          Invoke-Pester -Path tests -CI
      - name: Test d'interface (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:TDFOCUS_DATA = Join-Path $env:RUNNER_TEMP 'tdfocus-51'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File src\TDfocus.ps1 -SmokeTest -Screenshot "$env:RUNNER_TEMP\captures-ps51"
          if ($LASTEXITCODE -ne 0) { throw "Test d'interface en échec ($LASTEXITCODE)" }
      - name: Test d'interface (PowerShell 7)
        shell: pwsh
        run: |
          $env:TDFOCUS_DATA = Join-Path $env:RUNNER_TEMP 'tdfocus-7'
          pwsh -NoProfile -ExecutionPolicy Bypass -STA -File src\TDfocus.ps1 -SmokeTest -Screenshot "$env:RUNNER_TEMP\captures-ps7"
          if ($LASTEXITCODE -ne 0) { throw "Test d'interface en échec ($LASTEXITCODE)" }
      - name: Installation, démarrage automatique et désinstallation (profil utilisateur)
        shell: powershell
        run: |
          $env:TDFOCUS_DATA = Join-Path $env:RUNNER_TEMP 'tdfocus-install'
          .\Install-TDfocus.ps1 -NoLaunch -NoDesktopShortcut
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\TDfocus'
          $app = Join-Path $dest 'src\TDfocus.ps1'
          if (-not (Test-Path $app)) { throw "Application non copiée dans $dest" }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $command = (Get-ItemProperty -Path $runKey -Name TDfocus).TDfocus
          Write-Host "Démarrage automatique : $command"
          if ($command -notlike "*$app*" -or $command -notmatch '-Startup') { throw 'Clé Run incorrecte' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'TDfocus.lnk'
          if (-not (Test-Path $link)) { throw 'Raccourci du menu Démarrer absent' }

          # La commande inscrite au démarrage lance bien l'application, qui reste ouverte.
          $exe, $arguments = [regex]::Match($command, '^"([^"]+)"\s+(.*)$').Groups[1, 2].Value
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          Start-Sleep -Seconds 12
          $log = Join-Path $env:TDFOCUS_DATA 'tdfocus.log'
          if (Test-Path $log) { Get-Content $log | Write-Host }
          if ($process.HasExited) { throw "TDfocus s'est arrêté au démarrage (code $($process.ExitCode))" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Échec' -Quiet)) { throw 'Erreur au démarrage' }
          if (-not (Test-Path (Join-Path $env:TDFOCUS_DATA 'state.json'))) { throw 'Aucune donnée enregistrée' }
          Stop-Process -Id $process.Id -Force

          .\Uninstall-TDfocus.ps1
          Start-Sleep -Seconds 4
          if ($null -ne (Get-ItemProperty -Path $runKey -Name TDfocus -ErrorAction Ignore)) { throw 'Clé Run restante' }
          if (Test-Path $link) { throw 'Raccourci restant' }
          if (Test-Path $dest) { throw 'Dossier d''installation restant' }
          Write-Host 'Installation et désinstallation sans droits administrateur : OK'
      - name: Journal de l'application
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter 'tdfocus.log' | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface
          path: |
            ${{ runner.temp }}/captures-ps51
            ${{ runner.temp }}/captures-ps7
          if-no-files-found: ignore
